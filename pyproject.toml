[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "korail-live-board"
version = "0.2.0"
description = "Source-aware KORAIL split-flap display"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1", "pydantic-settings>=2.6,<3",
  "shapely>=2.1,<3", "pyproj>=3.6,<4"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["data/*.json", "data/*.geojson", "data/snapshots/*.json"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
