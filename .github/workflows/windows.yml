name: Windows portable build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'docs/WINDOWS*'
      - 'requirements-windows-lock.txt'
      - 'pyproject.toml'
      - '.github/workflows/windows.yml'
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned Windows dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-windows-lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Test backend and desktop lifecycle
        run: python -m pytest -q -o faulthandler_timeout=30
      - name: Build portable ZIP and checksums
        run: python scripts/build_windows.py
      - name: Install browser for packaged application checks
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
      - name: Test the extracted EXE without Python or Node on PATH
        run: python scripts/test_windows_bundle.py
      - name: Upload checked Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: FlipBoard-windows-x64
          path: |
            dist/FlipBoard-*-windows-x64.zip
            dist/FlipBoard-*-windows-x64.zip.sha256
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-validation
          path: artifacts/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FlipBoard-windows-x64
          path: release
      - name: Publish the tested ZIP and SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --title "FlipBoard $RELEASE_TAG — Windows" \
            --notes 'Windows 10/11 x64: download windows-x64.zip, extract the whole folder, then open FlipBoard.exe. The Python runtime and built frontend are included; installing Python or Node.js is unnecessary. Source code archives are for development.'
